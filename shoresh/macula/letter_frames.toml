# letter_frames.toml: who writes and who is written to, per book that names them in its opening. Read from the Greek
# opening itself (the verses given); names are the Greek lexemes as MACULA has them. macula/probe_labels.py turns each
# name into the entity id of that word in those verses and stops if a name is not found there.
#
#   verses     the opening's verses in chapter 1 (first, last)
#   from       the writers named there (nominative); empty where the opening names none
#   to         the persons written to by name (dative or vocative); empty where a church or group is written to
#   to_number  singular | plural: the number the opening gives the readers
#
# A book without an entry has no frame of this kind (Matthew, Mark, John).

[ROM]
verses = [1, 7]
from = ["Παῦλος"]
to = []
to_number = "plural"

[1CO]
verses = [1, 2]
from = ["Παῦλος", "Σωσθένης"]
to = []
to_number = "plural"

