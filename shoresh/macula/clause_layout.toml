strong = ["559", "560"]                  # אָמַר, Aramaic אֲמַר

[words.say_infinitive]
doc = "The verb whose infinitive with לְ is לֵאמֹר, and with another preposition introduces a quotation (בֶּאֱמָרְכֶם)."
strong = ["559"]                         # אָמַר

[words.answer]
doc = "Verbs of answering: they open a speech only when a verb of saying follows in the verse (rule answer_needs_say)."
