words.subordinators_aramaic), a relative (words.relatives) or a preposition + relative (words.relatives.after_preposition),
Aramaic כָּל־קֳבֵל דִּי, an infinitive (words.infinitive_preposition), or a participle clause with וְ and without the article or a
subject (circumstantial). Aramaic דִּי inside a clause is the genitive particle and opens nothing."""
[features.di_first]
