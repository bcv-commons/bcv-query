# Hebrew clause layout: rules and settings
# ========================================
#
# Every decision of the clause-layout build that is not mechanics lives in this file:
#
#   [sources.*]        the external inputs (MACULA Hebrew, the lexeme spine, UHB, the versification map), pinned and checked
#   [books.*]          book groups that rules can be limited to
#   [scopes]           what a rule's `scope` can say
#   [words.*]          the words the rules look for (Strong's numbers, lemmas)
#   [forms]            groups of verb forms (MACULA wtype)
#   [macula]           MACULA rule and role codes the rules look for
#   [text]             marks in the text the rules look for
#   [relations.*]      the relation vocabulary, and which relations add a level of indentation
#   [depth]            the two depths, and other depth conventions
#   [conventions.*]    conventions a client can apply to the output
#   [features.*]       what each clause feature means (computed per clause in discourse_rules.features)
#   [rules.*]          every rule: what it does, examples, where it applies, and its parameters
#   [versification.*]  verses that English numbering divides inside the verse
#
# The Python code (macula/discourse_rules.py, macula/build_clause_layout.py) keeps only the mechanics: the stack of speech lines, the
# order in which the rules are tried, and how a link is made. discourse_rules.py contains no Hebrew words, Strong's numbers or book
# names; a test checks that every rule here is used in the code and every rule in the code is described here.
#
# Editing
# - Limit a rule to some books, or turn it off, with its `scope` (see [scopes]). A rule with `switchable = false` is part of the model
#   itself and stays "all".
# - Add or remove a word in a word list; lemmas are compared in Unicode NFC, so the order of the points does not matter.
# - Change which relations add a level of indentation in [relations.*].
# - build.json records this file's sha256, so every output says which settings made it. Raise `version` when a change alters the output.
# - Try a changed copy without editing this one: python -m macula.build_clause_layout --config my.toml --out /tmp/x
#
# Profiles
# - A profile is a small file in macula/profiles/ that names itself, extends this file (or another profile) and overrides only what it
#   changes, e.g. one rule's scope or whether a relation adds a level:
#       [profile]
#       name = "reader"
#       extends = "default"
#       doc = "..."
#       [relations.consequence]
#       adds_text_level = false
# - Build it with python -m macula.build_clause_layout --profile reader (output in macula/data/clause-layout-profiles/reader/).
#   build.json records the profile, the files it was built from and their sha256, the sha256 of the effective settings, and the keys
#   the profile changed.
# - A profile may not change [sources], [versification] or version, and may only set keys this file has (new book groups excepted).
#   Every shipped profile is loaded and checked by the tests.

version = "0.23"

[profile]
name = "default"
doc = """The default layout: BHSA-near steps, a law view (text_depth_law) for conditionals as in BHSA, cases of a law side by side in
text_depth. Other profiles (macula/profiles/<name>.toml) extend this one and override only what they change."""


# ------------------------------------------------------------------------------------------------------------------------- sources
# The external inputs of the build, pinned. The build checks every input it uses against these pins before it writes anything, and
# stops with the value it found when one differs. Updating a source is a deliberate edit here (and shows in the output's build.json).

[sources.macula_hebrew]
doc = """MACULA Hebrew syntax trees (Clear Bible): words, clauses, roles, Strong's numbers. Read through trees-macula.db, built by
`python -m macula.parse_lowfat_hbo` (a shallow clone of the repository at its newest commit) and `python -m macula.build_trees`, which
records the commit it was built from. The current trees-macula.db (built 2026-10-08) predates that record; it was built from the
clone made on 2026-10-03, at the commit below."""
repository = "https://github.com/Clear-Bible/macula-hebrew"
path = "WLC/lowfat"
commit = "47db250bd55d0d8577f2a94fba114ef16c35b23c"      # 2026-04-24
licence = "CC BY 4.0"
trees_db_sha256 = "efe5b5a1c5e8cea4f8b273328b665c58a49cd663ee24537ddac52c4f7c192f44"

[sources.lexeme_spine]
doc = """Our lexeme spine (bcv-commons, built from MACULA Hebrew and Greek, with STEPBible extended Strong's numbers): the person of each
verb and pronoun. Pinned by its spine_content_sha256 (spine_meta), which changes with any row."""
file = "lexeme-spine-macula.db"
spine_content_sha256 = "471a3ac7fb152fac5f31e28a383451a0ff35b8d4f2fb5f9a73ff2fe108d742a8"
licence = "CC BY 4.0"

[sources.uhb]
doc = """unfoldingWord Hebrew Bible, for the ketiv (which MACULA leaves out) only. Downloaded per book from the tag and cached in
macula/data/uhb/<tag>/. v3.0.0 marks 1,281 ketiv, v2.1.32 only 672."""
repository = "https://git.door43.org/unfoldingWord/hbo_uhb"
tag = "v3.0.0"
url = "https://git.door43.org/unfoldingWord/hbo_uhb/raw/tag/{tag}/{nn:02d}-{code}.usfm"
licence = "CC BY-SA 4.0"

[sources.versification]
doc = """bcv-commons/bibles' verse map from Hebrew (org) to English numbering, derived from STEPBible TVTMS, for verse_ref_en. Read
through vrsmap from cdn.bibel.wiki (cached in data/vrs, revalidated daily), so a change published by bibles stops the build here."""
repository = "https://github.com/bcv-commons/bibles"
cdn = "https://cdn.bibel.wiki/_vrs/"
tvtms_rev = "902681f77a4a2975b809555ff3c35ffe3c48a1d5"
licence = "CC BY 4.0"

[sources.versification.sha256]
"org-to-eng.json" = "efed1a4ea7e4e4ac5bab19f78a759ba641d0f25af086863c1fb1ff5327b83c98"
"org-to-eng.multiverse.json" = "63c5f9f4ee047769bbe65af21a3b2c6e1fc98f0873bc4402ba8307a8a934356b"
"org.vrs" = "bf70cea4115322d4b286206f240e90d12cf16abeec39ba351df1ef8cf9174e23"
"eng.vrs" = "743d88327cf2e0c6dd0cafb15f61cde0e67512a9ede03011520ffd660a9cb256"



# ------------------------------------------------------------------------------------------------------------------------- books

[books.poetry]
doc = "The poetic books."
books = ["JOB", "PSA", "PRO", "SNG", "LAM"]

[books.poetic]
doc = """Poetry and prophecy: the poetic books, Ecclesiastes and the Latter Prophets. Their speeches and oracles do not follow the
narrative's rules for when a speech ends."""
books = ["JOB", "PSA", "PRO", "ECC", "SNG", "LAM", "ISA", "JER", "EZK", "HOS", "JOL", "AMO", "OBA", "JON", "MIC", "NAM", "HAB", "ZEP",
         "HAG", "ZEC", "MAL"]

[books.oracles_framed_by_word_event]
doc = """Books whose oracles are framed by the word-event formula and its commands to speak, so that a paragraph mark divides an oracle
rather than ending it (Ezekiel: "וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר … בֶּן־אָדָם … וְאָמַרְתָּ … כֹּה אָמַר")."""
books = ["EZK"]

[books.law]
doc = "The books of the law: Exodus to Deuteronomy, where casuistic law (\"כִּי …\", \"אִם …\") is frequent."
books = ["EXO", "LEV", "NUM", "DEU"]

[books.narrative]
doc = "The narrative books outside the law and the prophets."
books = ["GEN", "JOS", "JDG", "RUT", "1SA", "2SA", "1KI", "2KI", "1CH", "2CH", "EZR", "NEH", "EST"]

[books.poems]
doc = "The books of poems: Job, Psalms, Proverbs, Song of Songs, Lamentations, Ecclesiastes."
books = ["JOB", "PSA", "PRO", "SNG", "LAM", "ECC"]

[books.first_person_narrator]
doc = """Books (or parts of books) whose narrator speaks in the first person: "וַיֹּאמֶר אֵלַי", "וָאֵרֶא". Elsewhere "אֵלַי" in a speech
is a character retelling (Deut 2:9 "וַיֹּאמֶר יְהוָה אֵלַי" in Moses' speech)."""
books = ["ISA", "JER", "EZK", "HOS", "AMO", "MIC", "HAB", "ZEC", "DAN", "EZR", "NEH"]


[scopes]
doc = """Where a rule applies:
  "all"            every book
  "none"           no book: the rule is turned off
  "<group>"        the books of a group in [books.*], e.g. "poetic"
  "not <group>"    the books outside a group, e.g. "not poetry"
  ["GEN", ...]     a list of USFM book codes"""


