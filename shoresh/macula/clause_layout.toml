[depth]
doc = """tree_depth counts every link up the discourse_parent chain whose relation adds a tree level. text_depth (the flat view) counts
the links whose relation adds a text level and whose discourse_rule is not in flat_rules: a chain stays on one level, an address and a
circumstantial clause stay on the line of the clause they belong to (the relation still says what they are)."""
flat_rules = ["embedded_flat"]           # see rules.embedded_keeps_macula_parent
# Each chapter starts at the margin: text_depth and text_depth_law count only the links inside the clause's chapter; a link into another
# chapter (a speech carried over the chapter break, Lev 7:1 in God's speech of Lev 6) stays in the tree (discourse_parent) but adds no
# level, so a reader who opens a chapter sees it start at the left. BHSA starts 925 of its 929 chapters with a root. tree_depth is not
# affected. Profile "continuous" sets this to false and counts across the break.
chapter_starts_at_margin = true

[depth.law]
doc = """text_depth_law: the flat view with conditionals laid out as in BHSA. Where a protasis comes before its apodosis (a link with
this relation to a later clause; the later clauses of a series stay parallel on the first), the protasis takes the apodosis's parent
and counts one level: it is indented one level from the clause the apodosis hung on. The apodosis hangs on the protasis and counts no
level: it stands level beside it, and what hangs on the apodosis moves with it. Every other link counts as for text_depth.
Laws in a row stand level (laws_in_a_row_stand_level): a protasis whose apodosis goes on, over flat links only, from the apodosis of
an earlier protasis takes that protasis's parent, so the next law stands beside the one before instead of under it (Deut 22, Deut
28:15 beside 28:1).
Return after a law (return_after_law): an apodosis's chain carries on over a verse end only with וְ + weqatal clauses (Lev 26:4-13);
any other main clause that opens a new verse after it (an x-yiqtol "וְכֵן תַּעֲשֶׂה", לֹא + yiqtol, an imperative, a nominal clause)
goes back to the level the law stands on, so the line's next commands don't move in with the apodosis (Deut 22:3). Off: tried in
0.15, it pulled whole apodoses back (Deut 28:3 "בָּרוּךְ אַתָּה" 1.57 -> 0.63 against BHSA's 1.68; Lev 4:7 "וְאֵת כָּל־דַּם … יִשְׁפֹּךְ")
and raised the law view's gap to BHSA's per-chapter reference for Leviticus and Deuteronomy from 0.61 to 0.73; limited to new commands
without וְ (לֹא + yiqtol, an imperative) it fixed Deut 22 (2.98 -> 2.35, BHSA 1.40) but still came out worse overall (0.65). In BHSA's
own links (bsb-add-books' figures, the law chapters) a verse-initial clause after an apodosis stays with the law 735 times and returns
215 times: "always stay" is right in 77%, and no rule from verb form, person, וְ, subject or negation does better (55-67%). A return
is more often nominal, without וְ and in another person, but each of these also catches clauses that stay. "(וְ)כֵּן תַּעֲשֶׂה" returns
in Deut 20:15 and 22:3 but stays in Num 18:28, too rare to carry a rule; Deut 22 (one return at 22:3 that carries through the chapter)
is left as a known case.
Staircase (staircase): each later protasis of a series of conditionals (rule subordinate_series) counts one level, so every new case
stands one level under the case before, as in BHSA (in text_depth the cases stay side by side). Since 0.17 a later case's own
apodosis (the next main clause) stands beside it and takes its chain along, a case steps in only after a case that has its own
apodosis (alternatives without one stand level), and the count restarts at each new law (rule law_cases_continue_the_law). Measured against BHSA's per-chapter
reference (379 chapters, law view): mean gap 0.410 -> 0.392; Job 31 -3.94 -> -1.44, Lev 27 -2.54 -> +0.26, Lev 3 -2.06 -> -1.67,
Lev 26 -2.32 -> -1.90. On since 0.16."""
relation = "conditional"
laws_in_a_row_stand_level = true
return_after_law = false
staircase = "law"


[conventions.verse_division]
doc = """The structure uses only the Masoretic division of the Hebrew text as MACULA gives it (WLC): the verse end (sof pasuq) and the
paragraph marks (ס/פ, text.paragraph_marks). A paragraph mark inside a verse counts where MACULA's text has one (only Ezra 2:69 and
2 Chr 27:5); the pisqa be'emtsa pasuq of other editions (Gen 35:22 and others) is not in MACULA's text and is not used. Segments
never cross a verse; links may. In the Decalogue (Exod 20, Deut 5), which has two accent systems, WLC's verse division counts.
English versification is only a label (verse_ref_en): it never decides a segment, a link or a level; a verse that English numbering
divides inside the verse (versification.split_verses) only changes the label of the segments from the given word on.
Several rules use the verse end ("a quotation ends with its verse", "a verse-initial 'for' looks back"): the sof pasuq is a real
Masoretic marker but a break in the reading, not the end of a speech, so these rules use it as the signal where nothing better is
known."""

[conventions.conditional_inversion]
doc = """In the tree a protasis hangs under its apodosis (relation conditional). A client that wants the other direction in the tree
inverts each conditional link whose protasis comes before the clause it hangs on (and that is the first of a series): the protasis
takes the apodosis's parent and relation, and the apodosis hangs under the protasis with relation conditional. A protasis after its
main clause is left as it is. This is a tree operation; for a flat view use text_depth_law ([depth.law]), not text_depth recomputed
on the inverted tree."""


