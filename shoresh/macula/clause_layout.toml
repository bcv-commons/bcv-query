    "6030",   # עָנָה answer
    "7592",   # שָׁאַל ask
    "560",    # Aramaic אֲמַר say
    "6032",   # Aramaic עֲנָה answer
    "4449",   # Aramaic מְלַל speak
]

[words.say]
