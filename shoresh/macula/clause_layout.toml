[words.oath_formula_verbs]
doc = "The verbs of the oath formula כֹּה יַעֲשֶׂה … וְכֹה יֹסִיף."
strong = ["6213", "3254"]                # עָשָׂה, יָסַף

[words.be]
doc = "הָיָה: the word-event formula (וַיְהִי דְבַר־יְהוָה) and a dated or temporal וַיְהִי."
