[features.plain_embedded]
doc = """An embedded clause with no opener (conjunction, relative, preposition), no infinitive, and a participle or no verb (Deut 28:25
"נִגָּף לִפְנֵי אֹיְבֶיךָ"): predicative participles, elliptic halves."""
[features.art_participle]
doc = """The clause opens with a participle with the article ("הַמַּקְרִיב", "הַנֹּגֵעַ"): a participle phrase that names someone."""
[features.every_lead]
doc = """The run of conjunctions and words.every a clause opens with, when it holds words.every: (its last token, the next token)."""
[features.first_key]
doc = "The key of the clause's first token."
[features.frame_be]
doc = "A bare \"וְהָיָה\": a weqatal of words.be with nothing but וְ (the frame of a fronted condition or time)."
[features.bare_np]
doc = """A clause that is a bare noun phrase: no verb, no opener, headed by a noun after any conjunction or article ("אִישׁ אִישׁ",
"נֶפֶשׁ", "וְאִישׁ", "אוֹ בָשָׂר", "וְהַבֶּגֶד")."""
[features.perceive]
doc = """A verb of seeing or knowing (words.perceive), or a narrative wayyiqtol of hearing (words.perceive narrated), in the stems
words.perceive stems, not negated, and not a verb of words.perceive reason_with_object that has an object of its own:
"וַיַּרְא אֱלֹהִים", "וִידַעְתֶּם", "וְרָאָה הַכֹּהֵן", "וַיִּשְׁמַע דָּוִד"; not "וְלֹא תִרְאֶה אֶת־הָאָרֶץ כִּי־מוֹפֵת נְתַתִּיךָ" (Ezek 12:6)."""
[features.thing_case]
doc = """A case that names a thing: "אִם" followed (after any preposition, article or object marker) by a noun that is not a time word
(words.time): "וְאִם מִשְּׂדֵה אֲחֻזָּתוֹ", "וְאִם אֶת־שְׂדֵה מִקְנָתוֹ", "וְאִם־בְּהֵמָה"; not "אִם־מִשְּׁנַת הַיֹּבֵל", "וְאִם־אַחַר
הַיֹּבֵל", "וְאִם־גָּאֹל יִגְאַל"."""
[features.verbs]
doc = "The Strong's numbers of the clause's verbs (rule repeated_condition_stands_level)."
[features.back_reference]
doc = "The clause has a demonstrative that refers back (words.back_reference)."
[features.or_topic_np]
doc = """A noun phrase standing alone after "or" (words.alternative), as features.topic_np: "אוֹ נֶפֶשׁ" (Lev 5:2)."""
[features.subject_first]
doc = """A clause whose subject comes first (macula.subject_first_prefix), headed by a noun, without an opener: "וְהַבָּשָׂר … לֹא יֵאָכֵל"
(Lev 7:19), "וְכָל־תְּרוּמָה … לוֹ יִהְיֶה" (Num 5:9)."""
[features.topic_np_circ]
doc = """A noun phrase standing alone that MACULA's participle makes look circumstantial ("וְנֵדֶר אַלְמָנָה וּגְרוּשָׁה", Num 30:10): headed
by a noun, not a time word; it can head a law (rule noun_phrase_law_head)."""
[features.prohibition]
doc = "A prohibition: a negated 2nd-person yiqtol (\"לֹא תְגַלֶּה\")."
[features.only_cj]
doc = """The clause's words are only conjunctions: a MACULA node that coordinates the clauses under it ("אוֹ רָאָה אוֹ יָדָע", Lev 5:1)
(rule coordinated_clauses_stand_level)."""
[features.place_there]
doc = "The clause has \"there\" (words.place_there)."
[features.subj_nouns]
doc = "The Strong's numbers of the nouns in the clause's subject (rule repeated_condition_stands_level)."
[features.chain_end]
doc = "The clause opens with an opener that ends a \"therefore\" chain (words.chain_end)."
[features.closing]
doc = """A closing formula: a clause without a finite verb opened (after any "and") by words.closing_this ("אֵלֶּה הַמִּצְוֹת",
"אֵלֶּה דִבְרֵי הַבְּרִית"). With words.lawgiver named in a clause under it, it can close a block of speech (rule
closing_formula_is_narrator)."""
[features.names_lawgiver]
doc = "words.lawgiver is named in the clause."
[features.lawgiver_subject]
doc = "words.lawgiver is the subject of the clause (\"וַיְדַבֵּר מֹשֶׁה\")."
[features.topic_np]
doc = """A noun phrase standing alone (macula.topic_rules), without a finite verb or an opener, headed by a noun or by a participle with
the article, after "and" only ("וְאִישׁ", "וְכָל־נֶפֶשׁ", "וְהַצָּרוּעַ"; not "גַּם כָּל־חֳלִי", Deut 28:61, or "אוֹ אִישׁ", Num 5:30), not
by a time word (words.time). With a relative clause after it, it can head a
law (rule relative_law_head)."""
[features.extension]
doc = """The legal extension formula: כֵּן in the first two words, a 2nd-person yiqtol or weqatal of words.do, and לְ with the further case
("וְכֵן תַּעֲשֶׂה לַחֲמֹרוֹ", Deut 22:3)."""
[features.then]
doc = "The clause opens with an apodosis marker (words.apodosis_markers)."
[features.number]
doc = "The verb's number (singular, plural), from the lexeme spine."
[features.law_head]
doc = "The clause opens with a word that starts a new law (words.law_heads), followed by a noun."
[features.law_summary]
doc = "The clause opens with words.summary_this and has words.summary_law: \"זֹאת תּוֹרַת …\"."
[features.role]
doc = "The MACULA clause node's role."
[features.circ]
doc = "A verbless clause opened by וְ + a non-verb, not a verb of speaking."


# ------------------------------------------------------------------------------------------------------------------------- rules
# In the order discourse_rules.derive tries them for each clause (the two of build_clause_layout first).
#
# The model. Every clause gets a discourse_parent (an earlier clause, or for a protasis the later apodosis) and a relation, except the
# first clause of a line. The narrative is one line; a speech opens a line of its own under its speaking clause, and lines nest. Main
# clauses chain along their line; subordinate and embedded clauses hang on a main clause. The rules below decide when a line opens and
# closes, which clause a clause hangs on, and with which relation.

# ---- where the text starts afresh (build_clause_layout)

[rules.each_psalm_starts_afresh]
scope = ["PSA"]
doc = "Each Psalm starts afresh: no speech or chain goes on from the Psalm before."

[rules.chapter_after_mark_starts_afresh]
scope = "poetic"
doc = """In poetry and prophecy a chapter that starts after a paragraph mark (text.paragraph_marks) starts afresh: every speech
closes. A speech opened by a narrative speaking clause (Amos 1:2 "וַיֹּאמַר", "וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר") otherwise stays
open over paragraph marks until the narrative resumes."""

# ---- where speeches end

[rules.paragraph_mark_closes_commanded_speech]
scope = "not oracles_framed_by_word_event"
doc = """A paragraph mark (ס/פ) ends a speech opened by a messenger formula or a command to say, and what is nested in it, unless the
command carries its speech (rule command_at_speech_start_carries)."""

[rules.commanded_law_carries]
scope = "law"
doc = """In the law books, a commanded speech whose first clause heads a law ("וַאֲלֵהֶם תֹּאמַר אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל … אֲשֶׁר־יַעֲלֶה",
Lev 17:8) carries its speech like a command at a speech's start (rule command_at_speech_start_carries): a paragraph mark between two
laws does not end it. Lev 17:10, 17:13 and 17:15 stand parallel to the head of 17:8 inside what Moses is to say, as in BHSA
(bsb-add-books)."""
examples = ["Lev 17:8-16"]

[rules.closed_oracle_returns_to_frame]
scope = "all"
doc = """When a paragraph mark closes an oracle whose messenger formula was the first clause of a commanded speech (and nothing came
after the formula on that speech's line), the speech goes on from its frame: the next clause hangs on the frame (the לֵאמֹר), level
with it, not on the formula."""
examples = ["Jer 2:4 \"שִׁמְעוּ דְבַר־יְהוָה\" on the לֵאמֹר of 2:2, as the next thing Jeremiah is to proclaim"]

[rules.chapter_closes_prophetic_speech]
scope = "all"
doc = "A new chapter ends a prophetic speech (rule retold_history_in_prophetic_speech) and what is nested in it."

[rules.chapter_restarts_chains]
scope = "all"
doc = "A new chapter starts each open line afresh: the speech goes on, but its chain of main clauses and its stanza heads restart."

[rules.quotation_ends_with_verse]
scope = "all"
doc = """A quotation (a line marked as one by the rules that open it) ends with its verse: the Masoretic verse end as the signal where
nothing better is known (conventions.verse_division)."""

[rules.nested_speech_ends_after_next_verse]
scope = "all"
doc = "A speech nested in another speech ends after the verse following the one it opened in."
verses_after = 1

[rules.nested_speech_ends_at_3rd_person]
scope = "all"
doc = """A nested speech also ends at a 3rd-person וְ-clause (qatal or wayyiqtol, no 1st/2nd-person pronoun, not a verb of speaking)
that opens the next verse: the speaker is talking about the people again."""
examples = ["Jer 7:24 \"וְלֹא שָׁמְעוּ\" after the command quoted in 7:23", "Gen 42:23 \"וְהֵם לֹא יָדְעוּ\""]

[rules.selah_ends_quotation]
scope = "all"
doc = "סֶלָה ends a quotation."

[rules.messenger_returns]
scope = "all"
doc = """A new messenger formula while the oracle of an earlier one is open (and no command or other long speech was opened after it)
closes that oracle: the new formula hangs where the earlier one did, not on the oracle's last clause."""
examples = ["Jer 7:21 \"כֹּה אָמַר יְהוָה צְבָאוֹת\" level with 7:20 \"לָכֵן כֹּה אָמַר\"", "Amos 3:12 after 3:11"]

[rules.negated_saying_is_quotation]
scope = "all"
doc = """Words that were not said: a speech opened by a negated verb of saying (words.say) is a quotation that ends with its verse. In
its verse it also ends at a וְ-clause that names its own subject and has a 1st-person pronoun (God speaking again, where the words
spoke of God in the 3rd person): the next item of a list, not part of the words."""
examples = ["Jer 2:6 \"וְלֹא אָמְרוּ אַיֵּה יְהוָה\"", "Jer 2:8 \"הַכֹּהֲנִים לֹא אָמְרוּ אַיֵּה יְהוָה וְתֹפְשֵׂי הַתּוֹרָה לֹא יְדָעוּנִי\""]

[rules.proclaim_returns]
scope = "all"
doc = """A new command to the prophet to speak (features.proclaim) returns to the line that gave an earlier command to speak: the
speeches opened since then close."""
examples = ["Jer 7:27 \"וְדִבַּרְתָּ אֲלֵיהֶם\" goes back to the level of 7:2 \"וְאָמַרְתָּ\"", "Ezek 20:30 \"לָכֵן אֱמֹר\"",
            "Ezek 33:27 \"כֹּה־תֹאמַר אֲלֵהֶם\" level with 33:25 \"אֱמֹר אֲלֵיהֶם\""]

# ---- embedded clauses

[rules.embedded_keeps_macula_parent]
scope = "all"
switchable = false
doc = """An embedded clause keeps its MACULA parent. Relation: relative (a relative clause, or one in a noun phrase: discourse_attach
is the antecedent's first word), complement (MACULA role in macula.complement_roles, or לֵאמֹר), the subordinate relation of its
opening (purpose, temporal, causal, conditional, complement), or embedded. A plain embedded clause (features.plain_embedded) gets
discourse_rule embedded_flat and stands next to its parent in the flat view (depth.flat_rules). One exception: rule
word_quote_hangs_on_main."""

[rules.participle_head_steps_in]
scope = "all"
doc = """A participle phrase with the article that is the head its clause is about steps one level in, instead of standing flat next
to the clause (features.plain_embedded, rule embedded_keeps_macula_parent): when it comes before its clause ("הַמַּקְרִיב אֶת־זֶבַח
שְׁלָמָיו לַיהוָה יָבִיא אֶת־קָרְבָּנוֹ", Lev 7:29, 7:33) or right after the clause's opening "every" ("וְכָל־הַנֹּגֵעַ בְּכֹל … יִטְמָא",
Lev 15:10; words.every). BHSA puts these one level in (bsb-add-books, v0.22). A participle after a noun ("הַכֹּהֵן הַמְחַטֵּא",
Lev 6:19) describes the noun and stays flat."""
examples = ["Lev 7:29 \"הַמַּקְרִיב אֶת־זֶבַח שְׁלָמָיו\"", "Lev 15:10 \"וְכָל־הַנֹּגֵעַ בְּכֹל\"", "Lev 11:24", "Jer 21:9 \"הַיֹּשֵׁב בָּעִיר הַזֹּאת\""]

[rules.word_quote_hangs_on_main]
scope = "all"
doc = """"The word which X spoke, saying …": a לֵאמֹר under a relative clause of speaking whose antecedent is a word (words.word) hangs on
the main clause that names the word: the quotation is the content of that word, and the relative clause only says who spoke it. An
exception to rule embedded_keeps_macula_parent (discourse_rule word_quote). A relative clause of the word-event ("הַדָּבָר אֲשֶׁר
הָיָה … לֵאמֹר", Jer 7:1) is not one: its verb is not a verb of speaking. Found in Amos 3:1, where BHSA hangs the לֵאמֹר on the main
clause. Narrowed in 0.17 to the call with an imperative of hearing ("שִׁמְעוּ אֶת־הַדָּבָר … אֲשֶׁר דִּבֶּר … לֵאמֹר"): BHSA hangs the
לֵאמֹר on the main clause in only 2 of the 6 places of the wider form (Amos 3:1, 2 Kgs 9:36; not Gen 39:19, 2 Kgs 15:12 of the same
shape as 2 Kgs 9:36, or 1 Kgs 2:4), so beyond the call there is no grammatical line to follow."""
examples = ["Amos 3:1 \"שִׁמְעוּ אֶת־הַדָּבָר הַזֶּה אֲשֶׁר דִּבֶּר יְהוָה עֲלֵיכֶם … לֵאמֹר\""]

[rules.lemor_opens_speech]
scope = "all"
doc = """A לֵאמֹר opens a speech, which hangs on the לֵאמֹר clause. When the speaking clause has just opened a speech, the speech moves
to its לֵאמֹר. A speech under the word-event formula is prophetic."""

[rules.quotation_in_oracle_ends_with_verse]
scope = "all"
doc = """Inside a prophetic speech, a speech opened by a לֵאמֹר under a clause that is not the word-event formula, not a command to say,
not spoken by God and not in the 1st person is what people say, quoted in the oracle: it ends with its verse. The oracle goes on after
it, and a command to say that answers it ("לָכֵן אֱמֹר אֲלֵיהֶם") stands in the oracle, not inside the quotation."""
examples = ["Ezek 33:24 \"יֹשְׁבֵי הֶחֳרָבוֹת … אֹמְרִים לֵאמֹר אֶחָד הָיָה אַבְרָהָם\" ends before 33:25 \"לָכֵן אֱמֹר אֲלֵיהֶם\"",
            "Jer 11:21", "Ezek 12:22"]

[rules.word_content_runs_on]
scope = "all"
doc = """A speech opened by a לֵאמֹר in a relative clause whose antecedent is the word (words.word, as the noun the relative clause is
attached to or in the clause it hangs on: "זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה לֵאמֹר") is the content of that word, the commandment that follows: it does not end with its verse (rules
speech_in_subordinate_ends_with_verse and quotation_in_oracle_ends_with_verse don't apply). BHSA's links hang the commandment on the
לֵאמֹר in all three places with לֵאמֹר; without it (Exod 16:16, 16:32, Lev 8:5, 9:6, Num 30:2) BHSA has no quotation (bsb-add-books)."""
examples = ["Lev 17:3 \"אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל\" on the לֵאמֹר of 17:2", "Exod 35:5", "Num 36:6"]

[rules.speech_in_subordinate_ends_with_verse]
scope = "law"
doc = """A speech opened by a לֵאמֹר under a subordinate or embedded clause (not the word-event formula) is a quotation that ends with
its verse: words quoted inside a protasis don't run on into the apodosis."""
examples = ["Deut 13:3 \"אֲשֶׁר־דִּבֶּר אֵלֶיךָ לֵאמֹר נֵלְכָה\" ends before 13:4 \"לֹא תִשְׁמַע\"", "Deut 13:7"]

[rules.commanded_lemor]
scope = "not poetry"
doc = """A לֵאמֹר under a command, inside a speech, opens a commanded speech, like וְאָמַרְתָּ אֲלֵהֶם: it lasts to the next paragraph
mark (or carries its speech, rule command_at_speech_start_carries) and is prophetic."""
examples = ["Jer 2:2 \"וְקָרָאתָ בְאָזְנֵי יְרוּשָׁלִַם לֵאמֹר\"", "Lev 4:2 \"דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר\""]

[rules.quotation_lines]
scope = "all"
doc = """Quotations that end with their verse (rule quotation_ends_with_verse):
- an infinitive of saying with a preposition other than לְ (בֶּאֱמָרְכֶם "in that you say");
- a 2nd-person or future verb of saying without an object (features.quote_say), or a וְאָמַרְתָּ that is not a command (rule
  command_needs_addressee), also inside a speech;
- a subordinate clause opened by words.quoting_subordinators with a verb of saying ("כִּי־תֹאמַר אֱדוֹם": the words hang under it).
A messenger formula ends an open quotation."""
examples = ["Mal 1:5 \"וְאַתֶּם תֹּאמְרוּ\"", "Mal 1:6 \"וַאֲמַרְתֶּם בַּמֶּה בָזִינוּ\"", "Mal 1:12 \"בֶּאֱמָרְכֶם\"", "Mal 1:4 \"כִּי־תֹאמַר אֱדוֹם\""]

# ---- when the narrative resumes (closing every speech)

[rules.narrative_resumes]
scope = "all"
switchable = false
doc = """The narrative resumes, closing all speeches, at a 3rd-person wayyiqtol. A wayyiqtol with a 1st- or 2nd-person pronoun
("וַתִּפָּעֶם רוּחִי", Dan 2:3) stays in its speech."""

[rules.narrator_says]
scope = "all"
doc = """The narrator's own "וָאֹמַר" (a 1st-person wayyiqtol of saying, without a 2nd- or 3rd-person pronoun and not followed only by an
infinitive) resumes the narrative when the outermost speech is addressed to "me" (Jer 1:4 "וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר"). In a
speech addressed to someone else it is a retelling (Gen 24:42); "I said to you" is God retelling (Ezek 16:6 "וָאֹמַר לָךְ בְּדָמַיִךְ
חֲיִי"), and "I said to pour out" (Ezek 20:8 "וָאֹמַר לִשְׁפֹּךְ") is a thought."""

[rules.closing_formula_is_narrator]
scope = "all"
doc = """A closing formula (features.closing) with a clause under it in its verse that names Moses in the third person (words.lawgiver:
"אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה", "בְּיַד־מֹשֶׁה") is the narrator's, closing the block of speech, when the outermost speech is the LORD's
or Moses' own (its frame has the LORD or Moses as subject): the narrative resumes, at the margin. It speaks of the LORD and of Moses in
the third person; indented inside the speech it would read as the speaker's own words. BHSA has these at the narrative's level
(bsb-add-books). Not "זֹאת חֻקַּת הַתּוֹרָה אֲשֶׁר־צִוָּה יְהוָה אֶת־מֹשֶׁה" in Eleazar's speech (Num 31:21)."""
examples = ["Lev 27:34 \"אֵלֶּה הַמִּצְוֹת אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה\"", "Deut 28:69 \"אֵלֶּה דִבְרֵי הַבְּרִית\"", "Lev 26:46",
            "Num 30:17"]

[rules.aramaic_narrative_steps]
scope = "all"
doc = """In Aramaic the narrative resumes at a 3rd-person speaking clause in qatal or participle ("the king answered and said", which
opens the next speech; a yiqtol "let the king tell" is speech content; עֲנָה only with a following אֲמַר), or at a narrative step
(features.step)."""

[rules.retold_history_in_prophetic_speech]
scope = "all"
doc = """In a prophetic speech (opened by כֹּה אָמַר with God as the speaker, a command to say, or the word-event formula with its
לֵאמֹר) a wayyiqtol is retold history, not the narrative resuming. The narrative resumes only with a narrative frame: the word-event
formula, a dated וַיְהִי, a wayyiqtol of saying with a proper noun ("וַיֹּאמֶר יְהוָה אֵלַי"), a 3rd-person wayyiqtol with a named
subject (features.named_subject) and no 1st/2nd-person pronoun, the narrator's "וָאֹמַר" (rule narrator_says), and the frames of rules
narrative_frames and narrator_frames. A new chapter also ends it (rule chapter_closes_prophetic_speech)."""
examples = ["Jer 2:5 \"וַיֵּלְכוּ אַחֲרֵי הַהֶבֶל וַיֶּהְבָּלוּ\" stays in the oracle", "Ezek 16, 20, 23", "Deut 26:5 \"וַיֵּרֶד מִצְרַיְמָה\"",
            "Jonah 1:3 \"וַיָּקָם יוֹנָה\" resumes", "Isa 37:8 \"וַיָּשָׁב רַב־שָׁקֵה\" resumes"]

[rules.dated_frame_without_you]
scope = "all"
doc = """A dated or temporal וַיְהִי with a 2nd-person pronoun is not a narrative frame: a date told to "you" belongs to the speech."""
examples = ["Ezek 16:23 \"וַיְהִי אַחֲרֵי כָּל־רָעָתֵךְ\" stays in the oracle"]

[rules.told_speech_ends_at_narrative]
scope = "narrative"
doc = """In the narrative books a speech someone is told to give (a command to say, with any messenger formula quoted in it) is a message
to deliver, not God speaking now: the narrative resumes after it at a 3rd-person wayyiqtol, as after any speech, instead of waiting
for a narrative frame (rule retold_history_in_prophetic_speech). In the law and the prophets the protection stays, because there the
commanded speech is the oracle itself and retells history (Deut 26:5)."""
examples = ["2 Kgs 9:4 \"וַיֵּלֶךְ הַנַּעַר\" after the message of 9:3", "Josh 20:7 \"וַיַּקְדִּשׁוּ\" after 20:2-6"]

[rules.poem_wayyiqtol_continues]
scope = "poems"
doc = """In the books of poems a speech opened by a narrated frame that names its speaker (a 3rd-person narrative verb with a named
subject, or a verb of saying right after one in its verse: "וַיַּעַן אִיּוֹב וַיֹּאמַר"), or by a song frame (features.song in its verse or
the verse before: Ps 18:1-2 "אֲשֶׁר דִּבֶּר לַיהוָה אֶת־דִּבְרֵי הַשִּׁירָה הַזֹּאת … וַיֹּאמַר"), is a poem (a quotation inside the poem,
"וַיְדַבְּרוּ בֵּאלֹהִים אָמְרוּ" in Ps 78:19, is not). A wayyiqtol inside the poem continues it, with or without a named subject
("וַיַּרְעֵם בַּשָּׁמַיִם יְהוָה"). It closes the quotations opened inside the poem, but not the poem. Only a frame of speaking with a proper noun or definite
subject, or the word-event formula, resumes the narrative. In BHSA's links wayyiqtols in the poetic books hang on a clause of the poem
521 times (Job 3–42:6 124, Psalms 331, the other books 66) and on the narrative frame once (Ps 106:24) (bsb-add-books' counts)."""
examples = ["Ps 18:8 \"וַתִּגְעַשׁ וַתִּרְעַשׁ הָאָרֶץ\"", "Job 20:15 \"וַיְקִאֶנּוּ\"", "Job 10:22"]

[rules.therefore_steps_out]
scope = "all"
doc = """After a verse that ends with a conclusion (words.conclusion: a "עַל־כֵּן" clause, relation consequence, with the chain that follows
it in its verse), the next verse returns to the line the "עַל־כֵּן" clause hangs on instead of hanging on it. In BHSA's links the verse
after such a verse goes back out 78 times, stays level 37 times and goes deeper 15 times (bsb-add-books' counts): right 60% of the time.
Not after "לָכֵן", which mostly announces a judgement or opens an oracle ("לָכֵן כֹּה אָמַר") that the next verse goes on with: there
BHSA goes back out 43 times, stays level 61 times and goes deeper 82 times (55 of them after "לָכֵן כֹּה אָמַר"). With "לָכֵן" the
step-out took 23 lines closer to BHSA's layout and 43 farther (Jer 7:21-34, Jer 2:34-35, Ps 73:7, 73:11, Ezek 34:8-10), with
"עַל־כֵּן" 42 closer and 9 farther (bsb-add-books, v0.18)."""
examples = ["Ps 45:4 after \"עַל־כֵּן בֵּרַכְךָ אֱלֹהִים\" (45:3)", "Lam 3:22 after \"עַל־כֵּן אוֹחִיל\" (3:21)", "Amos 3:3",
            "not Ps 73:7 after \"לָכֵן עֲנָקַתְמוֹ גַאֲוָה\" (73:6)"]

[rules.therefore_chain_ends]
scope = "all"
doc = """A verse opened by "הוֹי" or "בַּיּוֹם הַהוּא" (words.chain_end) or by a new messenger formula ("כֹּה אָמַר" without "לָכֵן") ends the "therefore"
chain it stands in: it goes back to the line the nearest "therefore" clause above it hangs on. In BHSA's links in the Latter Prophets
הוֹי ends such a chain 4 times out of 4, and a new "כֹּה אָמַר" ends it 18 times, stands level with the לָכֵן clause 14 times and stays
deeper 13 times out of 45 (bsb-add-books). Weaker openers (an imperative, a vocative, "הִנֵּה") don't end it here; "בַּיּוֹם הַהוּא"
does since v0.23 (words.chain_end: Zeph 3:11)."""
examples = ["Amos 5:18 \"הוֹי הַמִּתְאַוִּים\" after 5:16 \"לָכֵן כֹּה־אָמַר\"", "Amos 3:12 \"כֹּה אָמַר יְהוָה\" after 3:11 \"לָכֵן כֹּה אָמַר\"",
            "Isa 5:18", "Isa 29:15", "Zeph 3:11 \"בַּיּוֹם הַהוּא\" after 3:8 \"לָכֵן\""]

[rules.named_quotation_in_poem_ends_with_verse]
scope = "poems"
doc = """In the books of poems, a speech whose frame names its speaker inside the poem (not a narrative wayyiqtol frame on the outermost
line, which opens a whole poem: "וַיַּעַן אִיּוֹב וַיֹּאמַר"; not a song frame; not God speaking) is a quotation, like any other, and
ends with its verse (rule poem_quotation_ends_with_verse). In BHSA's links such quotations end with their verse 33 times out of 37
(bsb-add-books). God's words in a psalm run on: "וְלָרָשָׁע אָמַר אֱלֹהִים" (Ps 50:16-23), "אֱלֹהִים דִּבֶּר בְּקָדְשׁוֹ" (Ps 60:8-10,
108:8-10), "אָמַר אֲדֹנָי מִבָּשָׁן אָשִׁיב" (Ps 68:23-24)."""
examples = ["Job 28:22 \"אֲבַדּוֹן וָמָוֶת אָמְרוּ\", ending before 28:23"]

[rules.poem_quotation_ends_with_verse]
scope = "poems"
doc = """In the books of poems a speech whose frame neither names its speaker nor sings (rule poem_wayyiqtol_continues) is a quotation
inside the poem: it ends with its verse, and the poem goes on. "וְאָמְרוּ אֵיכָה יָדַע־אֵל" (Ps 73:11) ends before "הִנֵּה־אֵלֶּה
רְשָׁעִים" (73:12); BHSA's links go back to the psalmist there (bsb-add-books)."""
examples = ["Ps 73:11-12", "Ps 10:6", "Ps 41:6"]

[rules.poem_resumes_after_quotation]
scope = "poems"
doc = """After a quotation inside a poem has ended with its verse (rule poem_quotation_ends_with_verse), the poem's next verse goes on at
the poem's own level: from the clause above the highest link on the line that adds a level, not from the quotation's frame wherever
it stands. "הִנֵּה־אֵלֶּה רְשָׁעִים" (Ps 73:12) is the psalmist again, after "וְאָמְרוּ אֵיכָה יָדַע־אֵל" (73:11), which stands inside
the description that "לָכֵן" (73:6, 73:10) opened; BHSA's links go back to the psalmist there (bsb-add-books). A continuation (וְ +
weqatal or wayyiqtol) still goes on from the clause before it. Only after a quotation whose frame says (words.say, or לֵאמֹר): not after
"מִמָּרוֹם יְדַבֵּרוּ" (73:8), which tells how they speak and goes on describing them in 73:9."""
examples = ["Ps 73:12 after 73:11"]

[rules.song_and_prayer_are_poems]
scope = "all"
doc = """A speech whose frame sings or prays (features.song in the speaking clause, or in any clause of its verse or the verse before
when the speaking clause names no subject or addressee of its own: "וַתִּתְפַּלֵּל חַנָּה וַתֹּאמַר", "אָז
יָשִׁיר־מֹשֶׁה … וַיֹּאמְרוּ", "וַיְדַבֵּר דָּוִד … אֶת־דִּבְרֵי הַשִּׁירָה … וַיֹּאמַר") is a song or a prayer. From the verse after its frame,
like an oracle, its wayyiqtols retell and continue it, and the narrative resumes only with a narrative frame or at a new chapter (once
the song has begun). Not "וַיִּתְפַּלֵּל אֶל־יְהוָה וַיֹּאמֶר לוֹ" (2 Chr 32:24), where God answers. In
BHSA's links the songs
in narrative books (Exod 15, Deut 32, Judg 5, 1 Sam 2, 2 Sam 22, Jonah 2, Hab 3) have 94 wayyiqtols on the song and one on the frame
(Jonah 2:11, after the prayer). In the frame's own verse a wayyiqtol still resumes the narrative: "וַיִּתְפַּלֵּל אֱלִישָׁע … וַיֹּאמַר
הַךְ־נָא … וַיַּכֵּם" (2 Kgs 6:18)."""
examples = ["Exod 15:1 \"אָז יָשִׁיר־מֹשֶׁה … וַיֹּאמְרוּ לֵאמֹר\"", "Judg 5:1 \"וַתָּשַׁר דְּבוֹרָה\"", "Jonah 2:2 \"וַיִּתְפַּלֵּל יוֹנָה\""]

[rules.first_person_wayyiqtol_continues_speech]
scope = "not first_person_narrator"
doc = """Outside the books with a first-person narrator, the speaker's own wayyiqtol of saying with a proper noun ("וָאֹמַר לִבְנֵי
יִשְׂרָאֵל") is not a narrative frame: it continues the speech. bsb-add-books counts 226 first-person wayyiqtols inside speeches outside
the Latter Prophets in BHSA's links (Gen 50, Josh 26, Judg 19, 1 Sam 19, 1 Kgs 19, Deut 18, 2 Sam 15, Exod 12, Job 12 and others). In
the first-person narrator books it is the narrative (rule narrator_says)."""
examples = ["Lev 17:14 \"וָאֹמַר לִבְנֵי יִשְׂרָאֵל\" stays in the LORD's speech"]

[rules.narrative_frames]
scope = "all"
doc = """More narrative frames in a prophetic speech: a וַיְהִי followed in its verse by a temporal clause, the compliance formula, and a
wayyiqtol of saying with a definite speaker (features.def_subject)."""
examples = ["Ezek 11:13 \"וַיְהִי כְּהִנָּבְאִי\"", "Exod 8:13 \"וַיַּעֲשׂוּ־כֵן\"", "Hag 2:12 \"וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ\""]

[rules.guided_narrative]
scope = "first_person_narrator"
doc = """When the outermost speech is addressed to "me", the guide leading "me" (features.lead_me: "וַיּוֹצִאֵנִי אֶל־הֶחָצֵר",
"וְהוֹצִיאַנִי דֶּרֶךְ הַשַּׁעַר") is the narrative: the guide's speech before it closes. In Ezek 40–48 BHSA's links put all 25
wayyiqtols with a 1st-person object in the narrative, none inside a speech (bsb-add-books' counts)."""
examples = ["Ezek 42:1 \"וַיּוֹצִאֵנִי\" after the guide's \"וַיְדַבֵּר אֵלַי\" of 41:22", "Ezek 42:15 \"וְהוֹצִיאַנִי\"", "Ezek 47:1-6"]

[rules.hand_of_the_lord_resumes]
scope = "first_person_narrator"
doc = """The hand of the LORD on "me" (features.hand: "וְיַד־יְהוָה הָיְתָה אֵלַי", "וַתִּפֹּל עָלַי שָׁם יַד אֲדֹנָי יְהוִה") is the
narrative: any speech before it closes."""
examples = ["Ezek 33:22 \"וְיַד־יְהוָה הָיְתָה אֵלַי בָּעֶרֶב\" after the fugitive's \"הֻכְּתָה הָעִיר\" (33:21)", "Ezek 8:1", "Ezek 37:1"]

[rules.son_of_man_returns_to_oracle_top]
scope = "oracles_framed_by_word_event"
doc = """"וְאַתָּה בֶן־אָדָם" (features.you_lead and features.son_of_man, in the clause or in the address right after it) inside an
oracle goes back to the oracle's top level: the speeches opened inside the oracle close, and it stands parallel to the oracle's first
main clause. The LORD turns to the prophet again. Occurs 23 times, all in Ezekiel. bsb-add-books measured 18 against the top level of
their oracle in BHSA's links: 9 at the top, 8 above it (at a chapter or oracle start), one deeper (Ezek 24:25)."""
examples = ["Ezek 33:30 at the level of \"בֶּן־אָדָם\" (33:24)", "Ezek 13:17", "Ezek 21:11"]

[rules.narrator_frames]
scope = "first_person_narrator"
doc = """When the outermost speech is addressed to "me", a 3rd-person wayyiqtol with a 1st-person pronoun and no 2nd-person pronoun is
the narrative when it is a verb of saying ("וַיֹּאמֶר אֵלַי") or its subject names God (God's spirit or glory acting on "me"). Applies
also outside prophetic speech."""
examples = ["Ezek 11:5 \"וַתִּפֹּל עָלַי רוּחַ יְהוָה וַיֹּאמֶר אֵלַי\""]

[rules.word_event_resumes]
scope = "all"
doc = "The word-event formula as a wayyiqtol always resumes the narrative, in any speech."
examples = ["Ezek 21:6 after the prophet's \"וָאֹמַר\" of 21:5"]

# ---- clauses that hang on their line without being main clauses

[rules.inquit]
scope = "all"
doc = """A speaking formula (words.formula), or a 3rd-person speaking clause without וְ that is not the first clause of its verse, not
a wayyiqtol and not a messenger formula, is an inquit: it hangs on the last main clause of its line, opens no speech, and the line goes
on past it. Without rule inquit_after_subordinate, that main clause must be in the same verse."""
examples = ["Isa 40:1 \"יֹאמַר אֱלֹהֵיכֶם\"", "\"נְאֻם יְהוָה\""]

[rules.inquit_after_subordinate]
scope = "all"
doc = "An inquit may follow subordinate clauses in its verse, with no main clause of its line in that verse."
examples = ["Mal 1:11 \"אָמַר יְהוָה צְבָאוֹת\" after two כִּי clauses"]

[rules.inquit_not_subordinate]
scope = "all"
doc = """A subordinate clause with a verb of saying is never an inquit: it keeps its subordinate relation, and a quotation after it hangs
on it (rule quotation_lines)."""
examples = ["Isa 40:5 \"כִּי פִּי יְהוָה דִּבֵּר\"", "Exod 12:26 \"כִּי־יֹאמְרוּ אֲלֵיכֶם בְּנֵיכֶם\"", "Deut 20:11 \"אִם־שָׁלוֹם תַּעַנְךָ\""]

[rules.vocative]
scope = "all"
doc = """An address (features.vocative) in a verse with an imperative or a 2nd-person verb hangs on the nearest main clause before it in
the verse, else on the next main clause."""

[rules.oath]
scope = "all"
doc = """While the speech goes on, a clause opened by words.oath_content that opens its verse or follows the oath directly is the oath's
complement (its content), and a clause opened by words.oath_reason is causal on the oath. A וְ-clause right after the oath in its verse
continues it (וְכֹה יֹסִיף)."""
examples = ["נִשְׁבַּעְתִּי", "כֹּה יַעֲשֶׂה … וְכֹה יֹסִיף", "חַי־אָנִי … אִם־לֹא"]

[rules.adversative]
scope = "all"
doc = "\"כִּי אִם\" right after a negated clause hangs on that clause: \"not … but\"."
examples = ["Jer 7:22-23"]

# ---- subordinate clauses

[rules.subordinate_series]
scope = "all"
doc = """The second and later clauses of a series of subordinate clauses with the same opener hang on the one before, as parallel:
right after it, or for conditionals anywhere in the same chapter. (A subordinate clause that opens a speech is the speech's first
clause, Ruth 1:10.) A convention: the cases of a law stand side by side as alternatives. BHSA hangs each new case one level under
the case before (in Exodus-Deuteronomy 54 such "וְאִם" clauses as conditional, 7 as parallel), so the law steps in further with every
case; that is most of the remaining depth gap in Leviticus (Lev 4:13, 4:22, 4:27; Lev 26:14-27) and in Exodus 21-22."""
examples = ["Isa 40:2 כִּי, כִּי, כִּי", "Lev 1:3, 1:10, 1:14 אִם"]

[rules.series_needs_same_relation]
scope = "all"
doc = """A subordinate clause joins a series only when it would have the same relation as the series's first clause, not only the same
opener: a fronted "כִּי" (a case of law, conditional) is no series member of a "כִּי" reason clause before it."""
examples = ["Deut 22:6 \"כִּי יִקָּרֵא קַן־צִפּוֹר\" after 22:5 \"כִּי תוֹעֲבַת יְהוָה\""]

[rules.law_cases_continue_the_law]
scope = "law"
doc = """In law, the cases of one law form one series, whatever their opener: an "אִם" case continues the series of the current law's
last case (Lev 27:15 "וְאִם־הַמַּקְדִּישׁ" after the case of 27:14). A new law starts afresh: a casus pendens with its case ("וְאִישׁ
כִּי־יַקְדִּשׁ", Lev 27:14), a fronted "כִּי" law, or "אַךְ" (words.law_heads, Lev 27:26, 28). In the law view each later case then
steps one level under the case before ([depth.law] staircase)."""
examples = ["Lev 27:14-15", "Lev 27:26 \"אַךְ\""]

[rules.ki_series_and_look_back]
scope = "poetic"
doc = """A כִּי series continues over a וְ-clause that continues the כִּי clause before it; a causal כִּי with no main clause before it
in its verse looks back to the last main clause of its line; and a וְ-clause continues a clause that continues a subordinate clause
(rule waw_continues_subordinate)."""
examples = ["Mal 1:11", "Jer 2:5 \"וַיֶּהְבָּלוּ\""]

[rules.subordinate_hangs_back]
scope = "all"
switchable = false
doc = "A subordinate clause hangs on the nearest main clause of its line before it in the verse."

[rules.subordinate_looks_back]
scope = "all"
doc = """A verse-initial Aramaic דִּי (causal) or a verse-initial participle clause looks back to the last main clause of its line: it
explains what came before."""

[rules.verse_initial_reason_looks_back]
scope = "poetic"
doc = "In poetry and prophecy a verse-initial reason clause (\"for\") looks back to the last main clause of its line."

[rules.subordinate_hangs_forward]
scope = "all"
switchable = false
doc = """Any other subordinate clause with no main clause before it in its verse waits for the next main clause and hangs on it (a
fronted protasis or time clause). If that main clause lies inside it, it hangs on the clause before it."""

[rules.frame_be_protasis_hangs_forward]
scope = "all"
doc = """A conditional or temporal clause right after a bare "וְהָיָה" (features.frame_be) hangs forward on its apodosis, like a fronted
protasis, not back on "וְהָיָה". The depths stay the same; the link matters for the conditional inversion."""
examples = ["Deut 28:1 \"וְהָיָה אִם־שָׁמוֹעַ תִּשְׁמַע … וּנְתָנְךָ\""]

[rules.law_heads_stand_parallel]
scope = "law"
doc = """A new law whose head is a main clause (a casus pendens, rule casus_pendens; a law-head word, words.law_heads) stands parallel
to the law head before it in its chapter, not on the previous law's last apodosis; the first law of a speech hangs on the speech as
before. The law's apodosis hangs on its own case: a subject climb never crosses a law head (rule subject_starts_new_step), and in the
law view the apodosis stands beside the casus pendens case. In the law books BHSA's links have 46 laws headed by a noun phrase before
כִּי: 20 parallel to the previous law head, 14 under the speech (the first law of a speech), 7 coordinated, 3 asyndetic, 2 roots; none
under the previous case or its apodosis (bsb-add-books). A case still waiting for its apodosis when the narrative resumes or a chapter
starts has none: the frame after a law ("וַיְדַבֵּר יְהוָה", Lev 7:22) is never a case's apodosis (v0.22). In the law view a law head that stands where the law head
before it stands also takes that head's level (v0.21): the second law of a speech is level with the first, not one level above it
(Lev 13 law view 2.95 → 3.80, BHSA 3.80; Lev 17 3.81 → 4.36; Lev 27 4.29 → 4.90)."""
examples = ["Lev 13: 13:18 → 13:24 → 13:29 → 13:38 → 13:40 → 13:47", "Lev 27: 27:2 → 27:14 → 27:26 → 27:28",
            "Lev 13:30 \"וְרָאָה הַכֹּהֵן\" on its case \"כִּי־יִהְיֶה בוֹ נָגַע\" (13:29), not on \"וְטִהֲרוֹ הַכֹּהֵן\" (13:28)"]

[rules.ki_after_perception_is_content]
scope = "all"
doc = """A כִּי clause right after a clause of seeing or knowing (features.perceive) is what is seen or known: relation complement, not
causal ("וַיַּרְא אֱלֹהִים … כִּי־טוֹב", "וִידַעְתֶּם כִּי־אֲנִי יְהוָה", "וְרָאָה … כִּי־פָשָׂה הַנֶּגַע", Lev 13:51). Only in the
same verse, and not when the כִּי clause speaks ("כִּי כֹה אָמַר יְהוָה", Jer 22:11; "כִּי אָמַר אֵלַי", 1 Sam 23:22). It hangs on that
clause, one level in, as before; a "וְכִי" after it goes on with it as a series ("כִּי־פָקַד … וְכִי רָאָה", Exod 4:31; Gen 3:6), while a
כִּי without "and" after it gives a reason again ("כִּי־פְרָעֹה אַהֲרֹן", Exod 32:25; Deut 9:6). The same holds for a כִּי
clause that MACULA embeds under such a clause. Not after "יָדַע" with an object of its own (words.perceive reason_with_object): "וְאַתֶּם
יְדַעְתֶּם אֶת־נֶפֶשׁ הַגֵּר כִּי־גֵרִים הֱיִיתֶם" (Exod 23:9) gives a reason; after "רָאָה" with an object ("וַיַּרְא … אֶת־הָאוֹר
כִּי־טוֹב", Gen 1:4) it is still what is seen. In the delivered chapters BHSA has 28 of the 32 relabelled clauses as object clauses
(bsb-add-books)."""
examples = ["Gen 1:10 \"וַיַּרְא אֱלֹהִים כִּי־טוֹב\"", "Ezek 6:7 \"וִידַעְתֶּם כִּי־אֲנִי יְהוָה\"", "Lev 13:51", "1 Sam 25:39 \"וַיִּשְׁמַע דָּוִד כִּי מֵת נָבָל\""]

[rules.thing_case_returns]
scope = "law"
doc = """In law, a case that names a thing (features.thing_case) stands with the last case of its law that named a thing, not with the
case just before it: the cases about when or how in between (a time, a redemption, a sale) are sub-cases of that first case. "וְאִם
אֶת־שְׂדֵה מִקְנָתוֹ אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ" (Lev 27:22), the field that was bought, goes with "וְאִם מִשְּׂדֵה אֲחֻזָּתוֹ"
(27:16), the field that was inherited, not under 27:20 "וְאִם־לֹא יִגְאַל" after 27:17-20; BHSA has it at 5, on 27:16 (bsb-add-books).
In the law view it is the next step of the staircase after 27:16."""
examples = ["Lev 27:22 on 27:16"]

[rules.coordinated_clauses_stand_level]
scope = "all"
doc = """The clauses under a MACULA node whose words are only conjunctions ("אוֹ רָאָה אוֹ יָדָע", Lev 5:1; "וְגַם … וְגַם") are
coordinated by it, not subordinate to it: they stand at its level (discourse_rule embedded_flat), as the clause after a lone
subordinator does (rule lone_subordinator_passes_relation). bsb-add-books found 18 such lone "אוֹ" segments in the delivered law
chapters with their verb one level under them."""
examples = ["Lev 5:1 \"אוֹ רָאָה אוֹ יָדָע\"", "Exod 21:31", "Num 30:3"]

[rules.lone_conjunction_takes_its_place]
scope = "all"
doc = """A segment that is only a conjunction ("אוֹ", "וְגַם", "אוֹ … אוֹ") and coordinates none or two or more clauses hangs in its own
verse, on the clause before it, or, at a verse start, waits for the next main clause; it is no clause's parent and does not count as
the line's last clause. The first clause it coordinates takes its place: in Exod 22:9 "כִּי־יִתֵּן … וּמֵת אוֹ־נִשְׁבַּר אוֹ־נִשְׁבָּה"
"וּמֵת" goes on from "כִּי־יִתֵּן" and the others stand parallel to it, inside the case, as in BHSA; in Exod 22:13 the "וְכִי־יִשְׁאַל"
under such a node is the protasis of the verse's apodosis (rule ki_after_or_is_conditional). bsb-add-books found 16 of 32 lone
conjunction segments in the delivered rows hanging on a clause of an earlier verse, and 9 protases, reasons or time clauses taking one
as their parent. A conjunction that opens a speech, or wraps a single clause ("אַף …"), stays as rule coordinated_clauses_stand_level
has it."""
examples = ["Exod 22:9", "Exod 22:13", "Exod 21:37", "Lev 5:1 \"אוֹ רָאָה אוֹ יָדָע\"", "Num 30:3"]

[rules.ki_after_or_is_conditional]
scope = "law"
doc = """In law, a "כִּי" right after a lone "אוֹ" (words.alternative), or a "כִּי / אִם" clause that a lone conjunction coordinates, is
"or if": a protasis (conditional), never "for" ("אוֹ כִי יִגַּע", Lev 5:3; "וְכִי־יִשְׁאַל", Exod 22:13)."""
examples = ["Lev 5:3", "Lev 15:25", "Exod 22:13"]

[rules.subject_relative_law_head]
scope = "law"
doc = """In the law books, inside a speech and after a law head on its line in the chapter, a clause at a verse start whose subject comes
first with a relative clause on it (features.subject_first: "וְאִישׁ אֲשֶׁר יִשְׁכַּב … מוֹת־יוּמְתוּ", Lev 20:11) heads a law, as a
noun phrase with a relative clause does (rule relative_law_head).
- A law inside a law: when a case of the running law is open ("וְאִם …" after the law's head) and the nearest law head is that law's
  own head (a casus pendens before כִּי, a law-head word, or a heading "זֹאת תּוֹרַת …"), the clause stays where it is, and the next law
  heads stand level with it, not with the law's top head (the law view keeps it in place). "וְהַבָּשָׂר אֲשֶׁר־יִגַּע בְּכָל־טָמֵא" (Lev
  7:19) after the cases of the peace offering (7:11-18), and "וְכָל־תְּרוּמָה … אֲשֶׁר־יַקְרִיבוּ" (Num 5:9) after 5:8 "וְאִם־אֵין לָאִישׁ
  גֹּאֵל": BHSA keeps them inside their law, with 7:20 level with 7:19 and Num 5:10 level with 5:9 (bsb-add-books).
- After a series of heads of its own kind (noun phrases, subjects with a relative clause: Lev 15:4-12) it is one more of them, level
  with the nearest.
- Heads of these kinds stand with the nearest law head; a casus pendens before כִּי, a law-head word or a law's summary is a new
  top-level law and stands with the last head of those kinds ("וְאִישׁ כִּי־תֵצֵא", Lev 15:16, with 15:2, not inside the law of the
  zav)."""
examples = ["Lev 7:19-20", "Num 5:9-10", "Lev 20:11, 20:15, 20:20", "Lev 15:4-12"]

[rules.noun_phrase_law_head]
scope = "law"
doc = """In the law books, a noun phrase standing alone at a verse start (features.topic_np, or features.topic_np_circ), followed
directly by its main clause (only segments under it in between), heads a new law, standing level with the last law head (rule
law_heads_stand_parallel): when a law head stands before it on its line in the chapter, or when its main clause is a prohibition
(features.prohibition). In BHSA's law chapters such heads (72) stand level with the previous law head 41 times, above it 11 times and
inside the previous case only 6 times; 14 are the chapter's first head (bsb-add-books). "וְנֵדֶר אַלְמָנָה וּגְרוּשָׁה … יָקוּם עָלֶיהָ"
(Num 30:10) and "כָּל־נֵדֶר וְכָל־שְׁבֻעַת אִסָּר … אִישָׁהּ יְקִימֶנּוּ" (30:14) go back up to the law's level; "עֶרְוַת אֲחוֹתְךָ … לֹא
תְגַלֶּה" (Lev 18:9-11) and "עַוֶּרֶת אוֹ שָׁבוּר … לֹא־תַקְרִיבוּ" (Lev 22:22) are each a new prohibition in a series. Not a place taken
up with "there", not inside a law to "you", and only inside a speech (as rule relative_law_head)."""
examples = ["Num 30:10", "Num 30:14", "Lev 18:9", "Lev 21:14", "Lev 22:22"]

[rules.summary_case_stands_with_the_law]
scope = "law"
doc = """A bare "וְהָיָה" whose case refers back to the cases before it ("וְהָיָה כִּי־יֶאְשַׁם לְאַחַת מֵאֵלֶּה", Lev 5:5: "in one of
these", words.back_reference) is about all of them: it stands where the laws stand, parallel to the last law head (rule
law_heads_stand_parallel), not under the last case. BHSA has it level with the case heads (bsb-add-books)."""
examples = ["Lev 5:5"]

[rules.relative_law_head]
scope = "law"
doc = """In law, a noun phrase standing alone (features.topic_np) whose next segment is a relative clause on it, with a main clause after
that in its verse, heads a new law, as a casus pendens before כִּי does: "וְאִישׁ אֲשֶׁר יִנְאַף … מוֹת־יוּמַת" (Lev 20:10). Like any law
head it stands parallel to the law head before it in its chapter (rule law_heads_stand_parallel), and the law's cases start afresh.
In the law books BHSA's links have as many law heads with אֲשֶׁר as with כִּי, 64 against 46 (bsb-add-books), among them Lev 20:10-21,
17:3, 17:8, 15:11, 13:58 and 11:9-33. "וְהַצָּרוּעַ אֲשֶׁר־בּוֹ הַנֶּגַע" (Lev 13:45) starts the law of how the leper lives: level with
13:40 "וְאִישׁ", not under 13:44.
- The relative clause may come after other segments under the noun phrase ("וְאִישׁ אִישׁ … הַגָּר בְּתוֹכָם אֲשֶׁר יָצוּד", Lev
  17:13), or as a segment of its own that MACULA does not attach ("וְהַנֶּפֶשׁ | אֲשֶׁר־תֹּאכַל", Lev 7:20).
- When the noun phrase and its relative clauses fill the verse, the main clause can open the next verse: "אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל
  … אֲשֶׁר יִשְׁחַט" (Lev 17:3, main clause in 17:4), "אִישׁ אִישׁ … אֲשֶׁר־יַעֲלֶה" (17:8, in 17:9). Such a head is no address
  (rule vocative). With 17:8 a head, 17:10, 17:13 and 17:15 stand parallel to it, as in BHSA (bsb-add-books).
- After "or" (words.alternative) only at a verse start, when a law head stands before it in the chapter with no law summary since:
  "אוֹ נֶפֶשׁ אֲשֶׁר תִּגַּע" (Lev 5:2) is the next case beside 5:1; not "אוֹ אִישׁ" after "זֹאת תּוֹרַת הַקְּנָאֹת" (Num 5:30).
- Only inside a speech: laws are spoken. Not "וְאֶשֶׁד הַנְּחָלִים אֲשֶׁר נָטָה" in the poem the narrator quotes (Num 21:15).
- Not when the main clause takes the noun up with "there" (words.place_there): "הַמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה … שָׁמָּה תָבִיאוּ"
  (Deut 12:11) stays in the law of 12:5-12.
- Not inside a law opened by a case that speaks to "you" (2nd person, or a 2nd-person pronoun) with no law head since:
  "וְהָאִישׁ אֲשֶׁר־יַעֲשֶׂה בְזָדוֹן" (Deut 17:12) is the last part of the law of 17:8 "כִּי יִפָּלֵא מִמְּךָ דָבָר"; BHSA coordinates it
  with 17:11 (bsb-add-books)."""
examples = ["Lev 13:45 \"וְהַצָּרוּעַ אֲשֶׁר־בּוֹ הַנֶּגַע\"", "Lev 20:10 \"וְאִישׁ אֲשֶׁר יִנְאַף\"", "Lev 11:9 \"כֹּל אֲשֶׁר־לוֹ סְנַפִּיר\"",
            "Lev 17:15 \"וְכָל־נֶפֶשׁ אֲשֶׁר תֹּאכַל נְבֵלָה\""]

[rules.law_summary_stands_with_the_law]
scope = "law"
doc = """A law's closing summary (features.law_summary: "זֹאת תּוֹרַת …") stands where the law stands: parallel to the last law head in its
chapter, or to the first clause of its speech when the chapter has none. In BHSA's links such a summary closes the law and stands at the
law's level (Lev 13:59 at 2, Num 5:29 at 3; bsb-add-books). Whether it is inside the speech BHSA is split on (20 places), so it stays
inside."""
examples = ["Lev 13:59 \"זֹאת תּוֹרַת נֶגַע־צָרַעַת\"", "Num 5:29 \"זֹאת תּוֹרַת הַקְּנָאֹת\"", "Lev 7:37"]

[rules.be_case_stands_level]
scope = "law"
doc = """In the law view's staircase ([depth.law] staircase), a case opened by "וְהָיָה" ("וְהָיָה אִם / כִּי", rule
frame_be_protasis_hangs_forward) stands level with the case before it instead of stepping in. In the law books BHSA's links have such a
case deeper than the previous case once, level 3 times and shallower once, against 53 / 13 / 15 for "וְאִם" (bsb-add-books)."""
examples = ["Deut 28:15 \"וְהָיָה אִם־לֹא תִשְׁמַע\" level with 28:1"]

[rules.repeated_condition_stands_level]
scope = "law"
doc = """In the law view's staircase, a negated condition that repeats the verb of the negated case it follows (that case's clause or
the infinitives under it: "אִם־לֹא תִשְׁמַע … לִשְׁמֹר לַעֲשׂוֹת" → "אִם־לֹא תִשְׁמֹר לַעֲשׂוֹת") states the same condition again, to open a
new round: it stands level with that case instead of stepping in. Deut 28:58 takes up 28:15 and stands beside it, as in BHSA
(bsb-add-books). Not when it refers back with "these" or "this" (words.back_reference: "גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה", Exod 4:9;
"וְאִם־עַד־אֵלֶּה לֹא תִשְׁמְעוּ לִי", Lev 26:18): "if even after these …" goes on from what came before, one step in. The same
subject (features.subj_nouns) counts as a repeat too, with a verb of like meaning: "וְאִם־לֹא תַגִּיעַ יָדוֹ" (Lev 5:7) and "וְאִם־לֹא
תַשִּׂיג יָדוֹ" (5:11), the two alternatives for the poor, stand level (BHSA 2 and 2)."""
examples = ["Deut 28:58 \"אִם־לֹא תִשְׁמֹר לַעֲשׂוֹת\" level with 28:15"]

[rules.ki_after_be_is_conditional]
scope = "all"
doc = """After "וְהָיָה" in the verse (features.frame_be), a כִּי clause with a yiqtol is "when/if", never "for": it is a protasis
(conditional) and hangs forward (rule frame_be_protasis_hangs_forward). BHSA has these as temporal or conditional (bsb-add-books)."""
examples = ["Exod 12:26 \"וְהָיָה כִּי־יֹאמְרוּ אֲלֵיכֶם בְּנֵיכֶם\"", "Josh 22:28 \"וְהָיָה כִּי־יֹאמְרוּ\""]

[rules.casus_pendens]
scope = "law"
doc = """In law, a bare noun phrase (features.bare_np) followed in its verse by a clause opened by words.case_openers is the topic of the
law (casus pendens), not an address: it stands on its line as a main clause, the case hangs under it (conditional, one level in), and
the apodosis comes back to it on the line, level with it."""
examples = ["Num 5:12 \"אִישׁ אִישׁ כִּי־תִשְׂטֶה אִשְׁתּוֹ\" … 5:15 \"וְהֵבִיא הָאִישׁ\"", "Lev 4:2 \"נֶפֶשׁ כִּי־תֶחֱטָא\""]

[rules.protasis_continued]
scope = ["LEV"]
doc = """While a protasis waits for its apodosis (a fronted conditional, or a case under its topic), a וְ-clause in the protasis's own
verse goes on with the protasis (continuation or coordination on the clause before it in the protasis); the first clause that opens
a new verse, or has no וְ, is the apodosis. The verse end is the Masoretic signal used here: in BHSA's law an apodosis opens a new
verse 2.6 times as often as a continuation (bsb-add-books' figures), but a continuation can open a verse and an apodosis can follow in
the same verse (Lev 4:3 "וְהִקְרִיב"), so this rule is an approximation. It applies to a protasis in a series too (Lev 26:14). Limited
to Leviticus, whose laws are long: in Deuteronomy's short laws the apodosis often stands in the protasis's verse (Deut 22:2, 22:8,
22:22), and the rule was neutral for the steps over the law chapters (bsb-add-books, v0.14)."""
examples = ["Lev 26:3 \"אִם־בְּחֻקֹּתַי תֵּלֵכוּ וְאֶת־מִצְוֺתַי תִּשְׁמְרוּ וַעֲשִׂיתֶם אֹתָם\" … 26:4 \"וְנָתַתִּי\""]

[rules.case_after_series_stands_level]
scope = "law"
doc = """A case opened by "כִּי" / "וְכִי" with a finite verb at the start of its verse, right after a series of law heads (the verse
before goes back, by level links, to a noun phrase with a relative clause, "וְכָל־הַמֶּרְכָּב אֲשֶׁר … יִטְמָא", rule relative_law_head),
stands level with the series, and its apodosis with it: in the flat view the protasis adds no level under its apodosis, in the law
view it takes no step. A verbless "כִּי" clause is a reason, not a case (Lev 17:11 "כִּי נֶפֶשׁ הַבָּשָׂר בַּדָּם הִוא"), and is left out. Lev 15:13 "וְכִי־יִטְהַר הַזָּב מִזּוֹבוֹ" after
15:9–12, one level too deep before (bsb-add-books, v0.22)."""
examples = ["Lev 15:13 \"וְכִי־יִטְהַר הַזָּב מִזּוֹבוֹ\" level with 15:12 \"וּכְלִי־חֶרֶשׂ\"", "Lev 5:3 after 5:2", "Lev 22:29", "Num 9:14"]

[rules.new_law_closes_protasis]
scope = "law"
doc = """A new law's head is never the apodosis of the case before it. When a protasis is still open (rule protasis_continued) and
the next verse opens with a law's head (a fronted noun phrase, a law-head word, or a subject that comes first), the case's apodosis
is in its own verse: its first weqatal clause after the protasis that names a subject of its own (Lev 25:25 "וּמָכַר מֵאֲחֻזָּתוֹ" goes on
with the case, "וּבָא גֹאֲלוֹ" is the apodosis), else its first weqatal; it continues the law from the clause before the protasis;
the clauses after it go on in the apodosis. Lev 15:24 "וְאִם שָׁכֹב יִשְׁכַּב … וּתְהִי נִדָּתָהּ עָלָיו" — "וְטָמֵא שִׁבְעַת יָמִים" is the apodosis,
not 15:25 "וְאִשָּׁה" (bsb-add-books, v0.22). Without a weqatal in the verse the protasis keeps its old behaviour."""
examples = ["Lev 15:24 \"וְטָמֵא שִׁבְעַת יָמִים\" apodosis of \"וְאִם שָׁכֹב יִשְׁכַּב\"", "Lev 15:8 \"וְכִבֶּס\"", "Lev 23:29 \"וְנִכְרְתָה\"", "Lev 25:25 \"וּבָא גֹאֲלוֹ\"", "Lev 27:27 \"וּפָדָה\""]

[rules.then_clause_is_apodosis]
scope = "all"
doc = """A fronted protasis followed within a few verses by a main clause opened by an apodosis marker ("אָז", "then") waits for that
clause: the main clauses between go on with the protasis, and the "then" clause is its apodosis. Found in Prov 2:1-5 (BHSA's
per-chapter reference); it also applies in Gen 24:41, Job 9:31, Ps 119:92, Isa 58:14 and wherever a protasis is followed by "then"."""
examples = ["Prov 2:1 \"בְּנִי אִם־תִּקַּח אֲמָרָי\" … 2:5 \"אָז תָּבִין יִרְאַת יְהוָה\""]
within_verses = 4
# Narrowed in 0.17 (bsb-add-books' check of v0.16, where it was right in Prov 2:1 and Isa 58:13 and wrong in six places): only a
# protasis that opens its verse or follows an address waits; not "אִם־לֹא" after a negated clause or in an oath ("but rather", Gen
# 24:38); waiting stops at a wayyiqtol, a new speaker (1 Kgs 3:15, Gen 24:39), or a main clause in the protasis's own verse whose finite
# verb differs in person or number (the apodosis is already there: 1 Kgs 3:14, Josh 20:5).

[rules.extension_formula_returns]
scope = "all"
doc = """The legal extension formula (features.extension) applies the law before it to a further case, so in the law view it goes back
to the level the law stands on, with what follows it (it acts only after an apodosis; text_depth is unchanged). It occurs in Exod
22:29, 23:11, 26:17, Deut 12:31, 20:15 and three times in Deut 22:3; BHSA returns in Deut 20:15 and 22:3, and Num 18:28 "כֵּן
תָּרִימוּ", which stays, has another verb. Found in Deut 22 (BHSA's per-chapter reference)."""
examples = ["Deut 22:3 \"וְכֵן תַּעֲשֶׂה לַחֲמֹרוֹ\""]

[rules.ki_before_main_is_conditional]
scope = "not poetic"
doc = """A כִּי before its main clause is conditional (casuistic law: "if a man …"); elsewhere it keeps the relation of its opener."""
examples = ["Exod 21:2 \"כִּי תִקְנֶה עֶבֶד עִבְרִי\""]

[rules.fallback_to_clause_before]
scope = "all"
doc = """A clause waiting for the next main clause that finds none before a new chapter or the end of the book hangs on the clause before
it."""

# ---- other clause kinds

[rules.circumstantial]
scope = "not poetry"
doc = """A verbless clause opened by וְ + a non-verb (features.circ) right after a wayyiqtol main clause of its verse, in the narrative
line, is circumstantial on that clause. In the poetic books such a clause is the second half of a couplet (coordination)."""

[rules.wayyiqtol_continues_subordinate]
scope = "law"
doc = """Inside a speech, a wayyiqtol right after a relative or causal/conditional clause continues that clause (the nearest such clause
the previous clause belongs to) and never starts a root or resumes the narrative: in the subordinate clause's own verse, or in a later
verse while a protasis still waits for its apodosis. Only where the wayyiqtol can't be the narrative: it is in the 1st or 2nd person
or has a 1st- or 2nd-person pronoun, or the protasis still waits; never a narrative frame (a named subject, compliance, a dated וַיְהִי,
the word-event formula, a verb of saying with a proper noun). Mostly retold history in a כִּי clause ("כִּי עֶבֶד הָיִיתָ … וַיִּפְדְּךָ"). In
the law corpus (Exod 21–23, Deut 12–26) BHSA's links have 8 such wayyiqtols: Deut 15:15, 17:3 (three), 18:17, 23:6, 24:18, 25:18
(bsb-add-books' counts)."""
examples = ["Deut 17:3 \"וַיֵּלֶךְ וַיַּעֲבֹד אֱלֹהִים אֲחֵרִים\" on \"אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע\" (17:2)", "Deut 24:18 \"כִּי עֶבֶד הָיִיתָ … וַיִּפְדְּךָ\""]

[rules.lone_subordinator_passes_relation]
scope = "all"
doc = """A segment that is only a subordinator (features.lone_sub) hangs back on the last main clause, and the segment after it, which
holds its verb, continues it: the subordinator and its verb read as one clause. The segmentation splits "עַד אֲשֶׁר לֹא־" from its verb
in Eccl 12:1, 12:2 and 12:6 (also in 2 Sam 17:13 and 1 Kgs 17:17)."""
examples = ["Eccl 12:1 \"עַד אֲשֶׁר לֹא־ | יָבֹאוּ יְמֵי הָרָעָה\""]

[rules.waw_continues_subordinate]
scope = "poetic"
doc = """In poetry and prophecy a וְ-clause right after a subordinate clause in the same verse (no main clause between) continues it:
continuation for a wayyiqtol or weqatal, else coordination."""
examples = ["Prov 8:7 \"וְתוֹעֲבַת שְׂפָתַי רֶשַׁע\" on \"כִּי־אֱמֶת יֶהְגֶּה חִכִּי\""]

[rules.be_goes_on_from_case]
scope = "law"
doc = """In law, a bare "וְהָיָה" right after a case that hangs back on the clause before it, in the same verse, goes on from that case
(continuation), as its apodosis: Lev 27:33 "וְאִם־הָמֵר יְמִירֶנּוּ וְהָיָה־הוּא וּתְמוּרָתוֹ יִהְיֶה־קֹּדֶשׁ" stays on the case's level, as in
BHSA and in v0.21 (bsb-add-books, v0.22: it had moved up one level)."""
examples = ["Lev 27:33 \"וְהָיָה\" after \"וְאִם־הָמֵר יְמִירֶנּוּ\""]

# ---- main clauses

[rules.main_clause_chain]
scope = "all"
switchable = false
doc = """A main clause hangs on the last main clause of its line: continuation (forms.chain; in a speech also
forms.chain_in_speech_with_waw with וְ), coordination (other וְ), or asyndetic. The first main clause of a speech hangs on its speaking
clause with relation speech; the first clause of the narrative line has no parent. A main clause takes the clauses waiting for it."""

[rules.asyndetic_climbs_to_run_head]
scope = "all"
doc = """An asyndetic clause hangs on the head of the run before it: from the last main clause, up over continuation, coordination and
parallel links within that clause's verse (not over an earlier asyndetic link)."""

[rules.consequence]
scope = "all"
doc = "A clause opened by words.consequence hangs on the last main clause of its line with relation consequence."
examples = ["Jer 2:9 \"לָכֵן עֹד אָרִיב אִתְּכֶם\""]

[rules.apodosis_keeps_its_chain]
scope = "all"
doc = """A chain clause that names its subject does not climb past an apodosis (a main clause that took a fronted protasis): the
apodosis's continuation stays with it (rule subject_starts_new_step)."""
examples = ["Lev 26:4 \"וְנָתְנָה הָאָרֶץ\" stays on \"וְנָתַתִּי גִשְׁמֵיכֶם\", not on 26:2 \"אֲנִי יְהוָה\""]

[rules.subject_starts_new_step]
scope = "all"
doc = """A chain clause that names its subject starts a new step: it hangs on the nearest earlier chain clause that also names one
(over continuation, coordination and parallel links), and the subjectless clauses after it fill that step in."""
examples = ["Gen 22:5 \"וַיֹּאמֶר אַבְרָהָם\" on 22:4 \"וַיִּשָּׂא אַבְרָהָם\""]

[rules.stanza_heads]
scope = "poetry"
doc = """A verse-initial asyndetic clause whose opening (features.opener) repeats the opening of an earlier verse-initial clause on its
line hangs on that one as parallel: a stanza head."""
examples = ["Job 3:20 לָמָּה on 3:11 לָמָּה", "Prov 8:10 קְחוּ on 8:6 שִׁמְעוּ"]

[rules.repeated_turn_is_parallel]
scope = "all"
doc = """A turn that repeats the opening of an earlier turn on its line (the same speaking verb and form, without וְ, not a wayyiqtol)
hangs on it as parallel."""
examples = ["Dan 2:8 עָנֵה מַלְכָּא on 2:5"]

# ---- speeches that open at a main clause

[rules.messenger_formula_opens_speech]
scope = "all"
doc = """The messenger formula כֹּה אָמַר opens a speech that lasts to the next paragraph mark (rule
paragraph_mark_closes_commanded_speech), nested if inside a speech. In a subordinate clause ("כִּי כֹה אָמַר יְהוָה") the oracle hangs
under that clause."""

[rules.command_to_say_opens_speech]
scope = "all"
doc = """Inside a speech, a command to say something (features.command_say, or a וְאָמַרְתָּ that rule command_needs_addressee counts as a
command) opens a speech like a messenger formula, unless only a לְ + infinitive follows (rule indirect_speech_opens_none). The line
that gave the command is remembered (rule proclaim_returns). A commanded speech is prophetic."""
examples = ["אֱמֹר", "וְאָמַרְתָּ אֲלֵהֶם", "כֹּה תֹאמַר"]

[rules.command_at_speech_start_carries]
scope = "all"
doc = """A command to say that comes at the start of a speech (in the speech's first verses) carries the rest of that speech: it lasts
as long as the speech, over paragraph marks."""
examples = ["Lev 1:2 \"דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם\""]
within_verses = 1                        # the command comes in the verse the speech opened in, or the next one

[rules.commanded_speech_in_poetry_ends_with_verse]
scope = "poetry"
doc = "In poetry a messenger formula or a command to say opens a quotation that ends with its verse or at סֶלָה, and carries nothing."

[rules.prophetic_needs_god]
scope = "all"
doc = """A messenger formula opens a prophetic speech only when its subject names God (features.divine); a human messenger formula opens
an ordinary speech. (A commanded speech is always prophetic.)"""
examples = ["Isa 37:3 \"כֹּה אָמַר חִזְקִיָּהוּ\"", "Exod 5:10 \"כֹּה אָמַר פַּרְעֹה\""]

[rules.command_needs_addressee]
scope = "all"
doc = """A 2nd-person weqatal of saying (וְאָמַרְתָּ) is a command to say only with an addressee (words.address) or right after a command
on its line; otherwise it is a quotation (rule quotation_lines)."""
examples = ["Mal 1:6 \"וַאֲמַרְתֶּם\" is a quotation", "Jer 7:28 \"וְאָמַרְתָּ אֲלֵיהֶם\" is a command", "Ezek 6:3 \"וְהִנָּבֵא … וְאָמַרְתָּ\""]

[rules.speaking_clause_opens_speech]
scope = "all"
switchable = false
doc = """A speaking clause (features.speak; not an imperative) opens a speech under it: in the narrative any speaking clause, inside a
speech only a narrated one (forms.narrated in the 3rd person, or a participle). A לֵאמֹר clause does too."""

[rules.answer_needs_say]
scope = "all"
doc = "A verb of answering (words.answer) opens a speech only when a speaking clause with words.say follows in its verse."
examples = ["Ps 3:5 \"he answered me\" opens none"]

[rules.indirect_speech_opens_none]
scope = "all"
doc = """A speaking clause whose only follow-up in its verse is a לְ + infinitive opens no speech: the infinitive is its complement
(indirect speech)."""
examples = ["Dan 2:12 \"and he commanded to destroy\""]

[rules.future_saying_is_quotation]
scope = "all"
doc = """A speech opened by a speaking clause that is not narrated (not 3rd-person wayyiqtol/qatal, not a participle, not a 1st-person
wayyiqtol/qatal) is a quotation: it ends with its verse ("יֹאמַר")."""

[rules.participle_of_saying_quotes]
scope = "poetry"
doc = """A participle of saying without an object of its own opens a quotation that ends with its verse or at סֶלָה. With an object
the clause says what is said, not a quotation: "אֹמֵר אָנִי מַעֲשַׂי לְמֶלֶךְ" (Ps 45:2) is the psalmist's statement about his poem
(BHSA has no quotation there), "כֻּלּוֹ אֹמֵר כָּבוֹד" (Ps 29:9)."""
examples = ["Ps 3:3 \"רַבִּים אֹמְרִים לְנַפְשִׁי\""]


