# Hebrew clause layout: rules and settings
# ========================================
#
# Every decision of the clause-layout build that is not mechanics lives in this file:
#
#   [books.*]          book groups that rules can be limited to
#   [scopes]           what a rule's `scope` can say
#   [words.*]          the words the rules look for (Strong's numbers, lemmas)
#   [forms]            groups of verb forms (MACULA wtype)
#   [macula]           MACULA rule and role codes the rules look for
#   [text]             marks in the text the rules look for
#   [relations.*]      the relation vocabulary, and which relations add a level of indentation
#   [depth]            the two depths, and other depth conventions
#   [conventions.*]    conventions a client can apply to the output
#   [features.*]       what each clause feature means (computed per clause in discourse_rules.features)
#   [rules.*]          every rule: what it does, examples, where it applies, and its parameters
#   [versification.*]  verses that English numbering divides inside the verse
#
# The Python code (macula/discourse_rules.py, macula/build_clause_layout.py) keeps only the mechanics: the stack of speech lines, the
# order in which the rules are tried, and how a link is made. discourse_rules.py contains no Hebrew words, Strong's numbers or book
# names; a test checks that every rule here is used in the code and every rule in the code is described here.
#
# Editing
# - Limit a rule to some books, or turn it off, with its `scope` (see [scopes]). A rule with `switchable = false` is part of the model
#   itself and stays "all".
# - Add or remove a word in a word list; lemmas are compared in Unicode NFC, so the order of the points does not matter.
# - Change which relations add a level of indentation in [relations.*].
# - build.json records this file's sha256, so every output says which settings made it. Raise `version` when a change alters the output.
# - Try a changed copy without editing this one: python -m macula.build_clause_layout --config my.toml --out /tmp/x

version = "0.11"


# ------------------------------------------------------------------------------------------------------------------------- books

[books.poetry]
doc = "The poetic books."
books = ["JOB", "PSA", "PRO", "SNG", "LAM"]

[books.poetic]
doc = """Poetry and prophecy: the poetic books, Ecclesiastes and the Latter Prophets. Their speeches and oracles do not follow the
narrative's rules for when a speech ends."""
books = ["JOB", "PSA", "PRO", "ECC", "SNG", "LAM", "ISA", "JER", "EZK", "HOS", "JOL", "AMO", "OBA", "JON", "MIC", "NAM", "HAB", "ZEP",
         "HAG", "ZEC", "MAL"]

[books.first_person_narrator]
doc = """Books (or parts of books) whose narrator speaks in the first person: "וַיֹּאמֶר אֵלַי", "וָאֵרֶא". Elsewhere "אֵלַי" in a speech
is a character retelling (Deut 2:9 "וַיֹּאמֶר יְהוָה אֵלַי" in Moses' speech)."""
books = ["ISA", "JER", "EZK", "HOS", "AMO", "MIC", "HAB", "ZEC", "DAN", "EZR", "NEH"]


[scopes]
doc = """Where a rule applies:
  "all"            every book
  "none"           no book: the rule is turned off
  "<group>"        the books of a group in [books.*], e.g. "poetic"
  "not <group>"    the books outside a group, e.g. "not poetry"
  ["GEN", ...]     a list of USFM book codes"""


