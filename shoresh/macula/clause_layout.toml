# second English verse. The other split verses (NUM 25:19, 1SA 21:1, 1KI 22:44, 1CH 12:5) map whole through org-to-eng.multiverse.

[versification.split_verses."PSA 13:6"]
from_key = "190130060071"                # אָשִׁירָה לַיהוָה ...; before it English 13:5
verse_ref_en = "PSA 13:6"

[versification.split_verses."ISA 63:19"]
from_key = "230630190101"                # לוּא־קָרַעְתָּ ...; before it English 63:19
verse_ref_en = "ISA 64:1"
