# A profile: it extends the default settings (macula/clause_layout.toml) and overrides only what it changes. See the header there.

[profile]
name = "indented_protasis"
extends = "default"
doc = """The layout of conditionals before 0.35: a protasis before its apodosis ("אִם־עֹלָה קָרְבָּנוֹ מִן־הַבָּקָר / זָכָר תָּמִים יַקְרִיבֶנּוּ",
Lev 1:3) is one level in, and the apodosis comes back to the line, so that the main clause stands on the main line. The default lays
conditionals out as BHSA does (the apodosis level with the protasis)."""

[depth]
conditionals_as_in_law_view = false
