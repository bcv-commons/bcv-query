# A profile: it extends the default settings (macula/clause_layout.toml) and overrides only what it changes. See the header there.

[profile]
name = "tree"
extends = "default"
doc = """Inside a verse, the clauses entering MACULA attachments where the tree's level was right more often than the rules (relatives,
phrases, clauses under cjpCLx, a כִּי clause under ClCl; tree.trusted) take the level MACULA's syntax tree gives them (rule
tree_level_inside_verse). A trial: the default leaves it off until its step agreement is measured."""

[rules.tree_level_inside_verse]
scope = "all"
