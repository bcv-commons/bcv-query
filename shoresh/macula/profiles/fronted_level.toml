# A profile: it extends the default settings (macula/clause_layout.toml) and overrides only what it changes. See the header there.

[profile]
name = "fronted_level"
extends = "default"
doc = """Conditionals in text_depth laid out as in the law view ([depth.law]) and in BHSA: a protasis before its apodosis ("אִם־עֹלָה
קָרְבָּנוֹ מִן־הַבָּקָר / זָכָר תָּמִים יַקְרִיבֶנּוּ", Lev 1:3) is one level in, and the apodosis stays on the protasis's level instead of coming
back to the line; the next verse that goes on from the apodosis goes back to the level the protasis started from (not the law view's
carried depth). Only conditionals (other fronted clauses keep the default). The default indents the
protasis and brings the apodosis back, so that the main clause stands on the line. Until 0.30 this profile put the protasis level
with the apodosis instead, which is neither layout (bsb-add-books, v0.30)."""

[depth]
conditionals_as_in_law_view = true
